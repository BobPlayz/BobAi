<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Offline · Jarvis</title>
<style>
  :root { color-scheme: light dark; --bg: #F2EDE3; --text: #15130F; --muted: #6b6457; --accent: #D9481C; }
  @media (prefers-color-scheme: dark) { :root { --bg: #12110E; --text: #F2EDE3; --muted: #a39b8c; } }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: var(--bg); color: var(--text); font: 17px/1.6 system-ui, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  h1 { font: 400 44px/1.05 Georgia, serif; margin: 0 0 12px; } em { color: var(--accent); }
  p { color: var(--muted); max-width: 30ch; margin: 0 auto 24px; }
  button { font: inherit; border: 0; border-radius: 999px; padding: 12px 22px; background: var(--text); color: var(--bg); cursor: pointer; min-height: 44px; }
</style></head>
<body><main>
  <h1>You're <em>offline.</em></h1>
  <p>Jarvis needs the internet to think. Check your Wi-Fi or data and try again.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main></body></html>
