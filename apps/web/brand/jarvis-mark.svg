<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Jarvis">
  <title>Jarvis</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A2620"/>
      <stop offset="1" stop-color="#15130F"/>
    </linearGradient>
    <radialGradient id="planet" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#EFE8DA"/>
      <stop offset="1" stop-color="#C2B49A"/>
    </radialGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A9781F"/>
      <stop offset="0.5" stop-color="#F0C766"/>
      <stop offset="1" stop-color="#B8862B"/>
    </linearGradient>
    <!-- The front half of the ring is drawn over the planet; the back half sits behind it. -->
    <clipPath id="front"><rect x="0" y="262" width="512" height="250"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <g transform="rotate(-18 256 268)">
    <ellipse cx="256" cy="268" rx="196" ry="60" fill="none" stroke="url(#brass)" stroke-width="26"/>
  </g>
  <circle cx="256" cy="268" r="108" fill="url(#planet)"/>
  <g transform="rotate(-18 256 268)" clip-path="url(#front)">
    <ellipse cx="256" cy="268" rx="196" ry="60" fill="none" stroke="url(#brass)" stroke-width="26"/>
  </g>
  <circle cx="392" cy="128" r="26" fill="#E2482A"/>
</svg>
