name: Deploy Jarvis to Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jarvis-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_ORG_ID: team_2Aqm7FezjJjWZwTAY25H83cY
      VERCEL_PROJECT_ID: prj_EgpPuMeh3HmMGVVA9usj7UtUvhLA
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Vercel token is configured
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Add VERCEL_TOKEN in GitHub repository Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Install Vercel CLI
        run: npm install --global vercel@62.5.0

      - name: Pull production settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build production deployment
        run: vercel build --prod --token="$VERCEL_TOKEN"

      # Migrate only after the build succeeds, so a broken build never changes the production schema.
      - name: Apply production database migrations
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          # Vercel does not return "Sensitive" variables to `vercel pull`, so a DATABASE_URL repository secret wins when set.
          if [ -n "$MIGRATION_DATABASE_URL" ]; then export DATABASE_URL="$MIGRATION_DATABASE_URL"; fi
          node --env-file-if-exists=.vercel/.env.production.local -e "process.exit(process.env.DATABASE_URL ? 0 : 1)" || { echo "::error title=Database migration skipped::DATABASE_URL is empty. Vercel hides Sensitive variables from 'vercel pull'; add DATABASE_URL as a GitHub repository secret."; exit 1; }
          node --env-file-if-exists=.vercel/.env.production.local node_modules/tsx/dist/cli.mjs scripts/migrate.ts

      - name: Deploy production build
        run: vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN"
