name: model-training

on:
  push:
    paths:
      - "model-training/**"
      - ".github/workflows/model-training.yml"
  pull_request:
    paths:
      - "model-training/**"
      - ".github/workflows/model-training.yml"

permissions:
  contents: read

jobs:
  dataset-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install training dependencies
        run: python -m pip install -r model-training/requirements.txt
      - name: Validate dataset policy helpers
        working-directory: model-training
        run: python -m unittest test_prepare_dataset.py test_pretraining_preparation.py test_tokenizer_input.py
      - name: Validate capability curriculum
        working-directory: model-training
        run: python -m unittest test_capability_curriculum.py
      - name: Validate production model architecture
        working-directory: model-training
        run: python -m unittest test_production_model.py
      - name: Validate all checked-in training sources
        working-directory: model-training
        run: python -m py_compile native_model.py train.py evaluate.py evaluate_production.py prepare_dataset.py prepare_pretraining.py build_final_dataset.py build_pretraining_corpus.py capability_curriculum.py build_multimodal_manifest.py build_teacher_dataset.py production_model.py train_production.py train_tokenizer.py production_model_server.py pipeline.py test_native_model.py test_capability_curriculum.py test_production_model.py test_pretraining_preparation.py test_tokenizer_input.py specialist_models.py train_specialist.py prepare_specialist_data.py specialist_server.py test_specialist_models.py
      - name: Run native model unit tests
        working-directory: model-training
        run: python -m unittest test_native_model.py
      - name: Run specialist model unit tests
        working-directory: model-training
        run: python -m unittest test_specialist_models.py
      - name: Validate synthetic pretraining split
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/bobai-pretrain.jsonl')
          with p.open('w',encoding='utf-8') as f:
              for i in range(100): f.write(json.dumps({'text': f'synthetic pretraining record {i} with enough deterministic content for validation'})+'\n')
          PY
          python model-training/prepare_pretraining.py --input /tmp/bobai-pretrain.jsonl --output-dir /tmp/bobai-pretrain-data
      - name: Prepare synthetic instruction dataset
        run: python model-training/prepare_dataset.py --input model-training/data/source.jsonl --output-dir /tmp/bobai-training-data
