name: Jarvis reminder scheduler

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jarvis-reminder-scheduler
  cancel-in-progress: false

jobs:
  trigger-reminders:
    name: Trigger due reminders
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Validate scheduler secret
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Add CRON_SECRET in GitHub repository Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Run reminder sweep
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail --silent --show-error --max-time 30 \
            --request GET \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            --header "Accept: application/json" \
            https://jarvis-x-ai-two.vercel.app/api/cron/reminders
