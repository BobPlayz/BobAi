name: dependency-lock

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "apps/*/package.json"
      - "packages/*/package.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dependency-lock-main
  cancel-in-progress: true

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit synchronized repository metadata if changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already synchronized"
            exit 0
          fi
          sed -i '/- \[x\] CI executes the full checked-in API test suite/a- [x] Automated lockfile synchronization keeps roadmap and handoff in the same commit' roadmap.md
          printf '\nThe dependency-lock workflow updates the npm lockfile together with roadmap.md and this handoff, preserving the repository commit invariant.\n' >> docs/BOBAI-HANDOFF-2026-09-11.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json roadmap.md docs/BOBAI-HANDOFF-2026-09-11.md
          git commit -m "chore(deps): synchronize npm lockfile"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
