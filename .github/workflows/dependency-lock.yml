python - <<'PY'
from pathlib import Path

roadmap = Path("roadmap.md")
handoff = Path("docs/BOBAI-HANDOFF-2026-09-11.md")

text = roadmap.read_text()
checkbox = "- [x] Automated lockfile synchronization keeps roadmap and handoff in the same commit"

if checkbox not in text:
    marker = "- [x] CI executes the full checked-in API test suite"
    text = text.replace(marker, marker + "\n" + checkbox, 1)
    roadmap.write_text(text)

handoff_line = (
    "The dependency-lock workflow updates the npm lockfile together with "
    "roadmap.md and this handoff, preserving the repository commit invariant."
)

handoff_text = handoff.read_text()

if handoff_line not in handoff_text:
    handoff.write_text(handoff_text.rstrip() + "\n\n" + handoff_line + "\n")
PY