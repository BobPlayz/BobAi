name: dependency-security-fix
on:
  push:
    branches: [security/audit-fix]
permissions:
  contents: write
jobs:
  update-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Regenerate lockfile and apply non-breaking security updates
        run: |
          npm install --package-lock-only --ignore-scripts
          npm audit fix --ignore-scripts || echo "Some advisories may require separate review; committing compatible updates."
      - name: Commit updated dependency files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- package.json package-lock.json apps/web/package.json; then
            git add package.json package-lock.json apps/web/package.json
            git commit -m "Apply compatible dependency security updates"
            git push
          fi
